name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate in updater environment
        run: npm test
        env:
          WORKROOM_DATA_DIR: ${{ runner.temp }}/workroom-validation
