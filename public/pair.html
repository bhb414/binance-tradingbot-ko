<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>같은 Wi-Fi 접속 · Futures Workroom</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/pair.css"></head><body><main><span class="eyebrow">FUTURES WORKROOM</span><h1>작업실에 연결</h1><p>서버 PC의 <b>설정 → 같은 Wi-Fi에서 접속</b>에 표시된 6자리 코드를 입력하세요.</p><form id="pair-form"><label for="pair-code">접속 코드</label><input id="pair-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autofocus><p id="pair-error" role="alert" hidden></p><button type="submit">연결</button></form><small>한 번 연결하면 이 기기에서 30일 동안 유지됩니다.<br>서버 PC에서 접속 허용을 끄면 연결이 해제됩니다.</small></main><script type="module" src="/pair.js"></script></body></html>
